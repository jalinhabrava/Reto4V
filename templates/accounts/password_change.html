{% load static %}
<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; frame-src 'none'" /><title>Cambiar contraseña · Reto4V</title><link rel="stylesheet" href="{% static 'dist/assets/app.css' %}" /></head>
  <body class="account-body">
    <main class="account-page account-page-narrow">
      <header class="review-topbar"><span class="brand"><img src="{% static 'brand-mark.svg' %}" alt="" width="36" height="36" /><span>Reto4V<span class="brand-dot">.</span></span></span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="account-link-button" type="submit">Cerrar sesión</button></form></header>
      <section class="account-form-card"><p class="kicker">Seguridad de la cuenta</p><h1>Cambia tu contraseña</h1><p>Antes de continuar, elige una contraseña que solo conozcas tú.</p><form method="post" class="account-form">{% csrf_token %}{{ form.as_p }}<button class="button button-dark" type="submit">Guardar y continuar</button></form></section>
    </main>
  </body>
</html>
