{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2238" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{ csp_nonce }}'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'self'" />
    <meta name="reto4v-preview-nonce" content="{{ csp_nonce }}" />
    <title>Programmy4V · Acceso</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'brand-mark.svg' %}" />
    <link rel="stylesheet" href="{% static 'dist/assets/app.css' %}" />
  </head>
  <body>
    <div id="root"></div>
    {# El token deja la cookie CSRF lista para el fetch de LoginScreen. #}
    <form hidden aria-hidden="true">{% csrf_token %}</form>
    <script type="module" src="{% static 'dist/assets/app.js' %}"></script>
  </body>
</html>
